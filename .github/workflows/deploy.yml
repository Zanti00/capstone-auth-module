name: deploy-auth-module

# Builds the capstone-auth-module images (proxy, api, web) and deploys them to
# the existing Azure Container Apps. Requires the infra repo to have been
# deployed first (ACR + environment + container app scaffolding).
#
# Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC).
#
# Security gates (php2shell CVE-2026-109618 / CVE-2026-109619 remediation):
#   1. composer audit must pass before any image is built.
#   2. The built auth-api image must run PHP >= MIN_PHP_VERSION.
#   3. Trivy must report no CRITICAL vulnerabilities in auth-api.
# Container apps are only rolled after all gates pass.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  RG: rg-capstone
  LOCATION: eastus
  ACR: capstoneacr0001
  # Immutable per-commit tag for traceability and rollback; `latest` is still
  # pushed as a secondary tag for anything that references it.
  IMAGE_TAG: ${{ github.sha }}
  MIN_PHP_VERSION: 8.3.36

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (audit only)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Composer audit
        working-directory: ./auth-service
        # TODO: make blocking once the pre-existing dependency advisories
        # (phpseclib, guzzle, laravel/framework, commonmark, symfony) are fixed
        # in a separate, subsystem-reviewed upgrade (phpseclib backs Passport keys).
        continue-on-error: true
        run: composer audit --locked --no-interaction

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    concurrency: { group: azure-auth, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build auth-api
        run: az acr build --registry ${{ env.ACR }} --image $ACR.azurecr.io/auth-api:$IMAGE_TAG --image $ACR.azurecr.io/auth-api:latest --file Dockerfile --context ./auth-service

      - name: Build auth-web
        run: az acr build --registry ${{ env.ACR }} --image $ACR.azurecr.io/auth-web:$IMAGE_TAG --image $ACR.azurecr.io/auth-web:latest --file Dockerfile --context ./web-interface

      - name: Build auth-proxy
        run: az acr build --registry ${{ env.ACR }} --image $ACR.azurecr.io/auth-proxy:$IMAGE_TAG --image $ACR.azurecr.io/auth-proxy:latest --file deploy/nginx.Dockerfile --context .

      - name: ACR login (for image gates)
        run: az acr login --name ${{ env.ACR }}

      - name: Gate - PHP runtime version
        run: |
          IMAGE=${{ env.ACR }}.azurecr.io/auth-api:$IMAGE_TAG
          docker pull "$IMAGE"
          docker run --rm --entrypoint php "$IMAGE" -v
          docker run --rm -e MIN_PHP_VERSION="$MIN_PHP_VERSION" --entrypoint php "$IMAGE" -r \
            'exit(version_compare(PHP_VERSION, getenv("MIN_PHP_VERSION"), "<") ? 1 : 0);'

      - name: Gate - Trivy scan auth-api
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ACR }}.azurecr.io/auth-api:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Roll auth-api
        run: az containerapp update -n auth-api -g "${{ env.RG }}" --image ${{ env.ACR }}.azurecr.io/auth-api:$IMAGE_TAG

      - name: Roll auth-worker
        run: az containerapp update -n auth-worker -g "${{ env.RG }}" --image ${{ env.ACR }}.azurecr.io/auth-api:$IMAGE_TAG

      - name: Roll auth-web
        run: az containerapp update -n auth-web -g "${{ env.RG }}" --image ${{ env.ACR }}.azurecr.io/auth-web:$IMAGE_TAG

      - name: Roll auth-proxy
        run: az containerapp update -n auth-proxy -g "${{ env.RG }}" --image ${{ env.ACR }}.azurecr.io/auth-proxy:$IMAGE_TAG