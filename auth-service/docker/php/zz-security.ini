; php2shell hardening (CVE-2026-109618 / CVE-2026-109619).
; Defence in depth only; the real fix is the PHP 8.3.36 base image.
; The auth API is JSON-only (no file uploads), so tight input limits are safe.
; Do NOT set memory_limit=-1 here: that workaround is only for unpatched runtimes.

; Removes the session upload-progress producer/consumer used by the confirmed exploit.
session.upload_progress.enabled = 0

; Bound request body / multipart work that can drive controllable OOM.
post_max_size = 2M
upload_max_filesize = 1M
max_file_uploads = 1
max_input_vars = 1000
max_input_nesting_level = 16

expose_php = 0
