<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to SBSI</title>
  </head>
  <body style="margin:0;padding:0;background-color:#F8F9FA;font-family:Arial,Helvetica,sans-serif;color:#1E293B;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color:#F8F9FA;">
      <tr>
        <td align="center" style="padding:24px;">
          <table role="presentation" cellpadding="0" cellspacing="0" width="600" style="background-color:#ffffff;border:1px solid #E2E8F0;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="padding:28px 36px;background-color:#252578;">
                <p style="margin:0 0 10px 0;font-size:12px;line-height:18px;text-transform:uppercase;color:#d7d8ff;font-weight:600;letter-spacing:0.5px;">Welcome Aboard</p>
                <h1 style="margin:0;font-size:28px;line-height:36px;color:#ffffff;font-weight:bold;">Welcome to SBSI</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 36px;">
                <p style="margin:0 0 18px 0;font-size:15px;line-height:24px;color:#475569;">Your account has been created by an administrator.</p>
                <div style="background-color:#F8F9FA;border:1px solid #E2E8F0;border-radius:6px;padding:16px 20px;margin-bottom:24px;">
                  <p style="margin:0 0 8px 0;font-size:14px;line-height:20px;color:#64748B;"><strong>Email:</strong> <span style="color:#1E293B;">{{ params.email }}</span></p>
                  <p style="margin:0;font-size:14px;line-height:20px;color:#64748B;"><strong>Temporary Password:</strong> <code style="background:#E2E8F0;padding:2px 8px;border-radius:4px;color:#252578;font-weight:bold;font-size:15px;">{{ params.temporary_password }}</code></p>
                </div>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px 0;">
                  <tr>
                    <td bgcolor="#252578" style="border-radius:6px;padding:12px 24px;">
                      <a href="{{ params.login_url }}" style="font-size:15px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;display:inline-block;">Login to Your Account</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:0;font-size:13px;line-height:20px;color:#64748B;">For security reasons, you will be required to change your password after your first login.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 36px 28px 36px;border-top:1px solid #F1F5F9;">
                <p style="margin:0;font-size:14px;line-height:22px;color:#64748B;">Thanks,<br><strong style="color:#252578;">SBSI Team</strong></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
